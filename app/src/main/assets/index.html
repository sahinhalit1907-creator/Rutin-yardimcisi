<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 min-h-screen antialiased transition-colors">

<!-- HEADER -->
<header class="sticky top-0 z-30 backdrop-blur-xl bg-zinc-50/80 dark:bg-zinc-950/80 border-b border-zinc-200/70 dark:border-zinc-800/70">
  <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex items-center gap-3">
    <div class="flex items-center gap-2.5 mr-auto">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-br from-indigo-500 to-violet-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
      </div>
      <div class="leading-tight">
        <h1 class="text-[15px] font-semibold tracking-tight">Takip Asistanı</h1>
        <p id="todayLabel" class="text-xs text-zinc-500 dark:text-zinc-400"></p>
      </div>
    </div>

    <div class="relative hidden md:block w-64">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"></i>
      <input id="searchDesktop" type="search" placeholder="Görev ara…" class="field !pl-9" />
    </div>

    <div class="relative">
      <button id="menuBtn" class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-zinc-200/70 dark:hover:bg-zinc-800 transition" title="Seçenekler">
        <i data-lucide="more-horizontal" class="w-5 h-5"></i>
      </button>
      <div id="menu" class="hidden absolute right-0 mt-2 w-56 rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 card-shadow p-1.5 pop z-40">
        <button data-act="demo" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 text-left"><i data-lucide="sparkles" class="w-4 h-4 text-amber-500"></i>Örnek verilerle doldur</button>
        <button data-act="export" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 text-left"><i data-lucide="download" class="w-4 h-4 text-sky-500"></i>Yedek al (dosyaya kaydet)</button>
        <button data-act="import" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 text-left"><i data-lucide="upload" class="w-4 h-4 text-emerald-500"></i>Yedekten geri yükle</button>
        <input id="importFile" type="file" accept="application/json,.json" class="hidden" />
        <p class="px-3 pt-1.5 pb-1 text-[11px] leading-snug text-zinc-500 dark:text-zinc-400">Veriler yalnızca bu cihazın tarayıcısında saklanır. Tarayıcı verilerini temizlerseniz silinir; düzenli yedek alın.</p>
        <div class="my-1 h-px bg-zinc-200 dark:bg-zinc-800"></div>
        <button data-act="reset" class="w-full flex items-center gap-2.5 px-3 py-2 text-sm rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 text-left text-rose-600 dark:text-rose-400"><i data-lucide="trash-2" class="w-4 h-4"></i>Tüm verileri sıfırla</button>
      </div>
    </div>

    <div class="relative">
      <button id="bellBtn" class="relative w-9 h-9 rounded-xl flex items-center justify-center hover:bg-zinc-200/70 dark:hover:bg-zinc-800 transition" title="Bildirimler">
        <i data-lucide="bell" class="w-5 h-5"></i>
        <span id="bellDot" class="hidden absolute top-1.5 right-1.5 w-2 h-2 rounded-full bg-emerald-500 ring-2 ring-zinc-50 dark:ring-zinc-950"></span>
      </button>
      <div id="notifPanel" class="hidden absolute right-0 mt-2 w-72 max-w-[calc(100vw-2rem)] rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 card-shadow p-4 pop z-40 space-y-3"></div>
    </div>

    <button id="themeBtn"class="w-9 h-9 rounded-xl flex items-center justify-center hover:bg-zinc-200/70 dark:hover:bg-zinc-800 transition" title="Temayı değiştir">
      <i data-lucide="moon" class="w-5 h-5 hidden dark:block"></i>
      <i data-lucide="sun" class="w-5 h-5 dark:hidden"></i>
    </button>

    <button id="addBtn" class="hidden sm:flex items-center gap-2 px-4 h-9 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium shadow-lg shadow-indigo-600/25 transition">
      <i data-lucide="plus" class="w-4 h-4"></i>Yeni Görev
    </button>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 sm:px-6 py-6 space-y-6">

  <!-- STATS -->
  <section id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-4"></section>

  <!-- CATEGORY TABS -->
  <section class="flex items-center gap-2">
    <div id="tabs" class="flex-1 flex gap-2 overflow-x-auto no-scrollbar py-1 -mx-1 px-1"></div>
    <button id="addCatBtn" class="shrink-0 flex items-center gap-1.5 px-3 h-9 rounded-full text-sm border border-dashed border-zinc-300 dark:border-zinc-700 text-zinc-600 dark:text-zinc-400 hover:border-indigo-500 hover:text-indigo-600 dark:hover:text-indigo-400 transition">
      <i data-lucide="folder-plus" class="w-4 h-4"></i><span class="hidden sm:inline">Kategori</span>
    </button>
  </section>

  <!-- SUB TABS (Aylık Rutinler > Aidatlar / Faturalar > türler) -->
  <section id="subTabs" class="space-y-2 -mt-2"></section>

  <!-- FILTERS -->
  <section class="flex flex-col md:flex-row md:items-center gap-3">
    <div class="relative md:hidden">
      <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-zinc-400"></i>
      <input id="searchMobile" type="search" placeholder="Görev ara…" class="field !pl-9" />
    </div>
    <div class="inline-flex p-1 rounded-xl bg-zinc-200/60 dark:bg-zinc-900 border border-transparent dark:border-zinc-800 self-start" id="statusSeg"></div>
    <div class="flex gap-2 md:ml-auto">
      <select id="dateFilter" class="field !w-auto">
        <option value="all">Tüm tarihler</option>
        <option value="today">Bugün</option>
        <option value="week">Önümüzdeki 7 gün</option>
        <option value="month">Bu ay</option>
        <option value="overdue">Geciken</option>
        <option value="nodate">Tarihsiz</option>
      </select>
      <select id="sortBy" class="field !w-auto">
        <option value="date">Tarihe göre</option>
        <option value="priority">Önceliğe göre</option>
        <option value="newest">En yeni</option>
        <option value="title">A–Z</option>
      </select>
    </div>
  </section>

  <!-- LIST -->
  <section id="list" class="grid grid-cols-1 lg:grid-cols-2 gap-3 sm:gap-4"></section>
</main>

<!-- Mobile FAB -->
<button id="fab" class="sm:hidden fixed bottom-5 right-5 z-30 w-14 h-14 rounded-2xl bg-indigo-600 text-white flex items-center justify-center shadow-xl shadow-indigo-600/40 active:scale-95 transition">
  <i data-lucide="plus" class="w-6 h-6"></i>
</button>

<!-- TASK MODAL -->
<div id="taskModal" class="hidden fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="absolute inset-0 bg-black/50 backdrop-blur-sm fade" data-close></div>
  <form id="taskForm" class="relative w-full sm:max-w-lg max-h-[92vh] overflow-y-auto rounded-t-3xl sm:rounded-3xl bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 card-shadow p-5 sm:p-6 pop space-y-4">
    <div class="flex items-center justify-between">
      <h2 id="modalTitle" class="text-lg font-semibold tracking-tight">Yeni Görev</h2>
      <button type="button" data-close class="w-8 h-8 rounded-lg hover:bg-zinc-100 dark:hover:bg-zinc-800 flex items-center justify-center"><i data-lucide="x" class="w-5 h-5"></i></button>
    </div>
    <input type="hidden" id="fId" />
    <div>
      <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Görev Adı *</label>
      <input id="fTitle" required maxlength="120" class="field" placeholder="Örn: Elektrik faturası" />
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Kategori</label>
        <select id="fCategory" class="field"></select>
      </div>
      <div>
        <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Öncelik</label>
        <select id="fPriority" class="field">
          <option value="low">Düşük</option>
          <option value="medium" selected>Orta</option>
          <option value="high">Yüksek</option>
        </select>
      </div>
    </div>
    <div id="subWrap" class="hidden grid grid-cols-2 gap-3">
      <div>
        <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Bölüm</label>
        <select id="fSub" class="field"></select>
      </div>
      <div id="btWrap" class="hidden">
        <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Fatura Türü</label>
        <select id="fBt" class="field"></select>
      </div>
    </div>
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <div>
        <label id="fDateLabel" class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Son Tarih / Hatırlatıcı</label>
        <input id="fDate" type="date" class="field" />
      </div>
      <div>
        <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Saat (isteğe bağlı)</label>
        <input id="fTime" type="time" class="field" />
      </div>
      <div id="amountWrap" class="hidden">
        <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Tutar (TL)</label>
        <div class="relative">
          <input id="fAmount" type="number" min="0" step="0.01" inputmode="decimal" class="field !pr-10" placeholder="0,00" />
          <span class="absolute right-3 top-1/2 -translate-y-1/2 text-sm text-zinc-400">₺</span>
        </div>
      </div>
    </div>
    <div>
      <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Açıklama</label>
      <textarea id="fDesc" rows="3" maxlength="500" class="field resize-none" placeholder="Notlar, detaylar…"></textarea>
    </div>
    <div id="recurWrap" class="space-y-2">
      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1.5">Tekrar</label>

    <div class="flex gap-3 pt-1">

</div>

<!-- TOAST -->
<div id="toast" class="fixed bottom-24 sm:bottom-6 left-1/2 -translate-x-1/2 z-[60] pointer-events-none"></div>

<script>
(() => {
  'use strict';

  /* ---------- Sabitler ---------- */
  const STORAGE_KEY = 'gorev-asistani-v1';
  const THEME_KEY = 'gorev-asistani-theme';
  const BILLS_ID = 'bills';
  const DEFAULT_CATS = [
    { id: 'routine',  name: 'Rutinler',             icon: 'repeat',         color: '#8b5cf6', builtin: true },
    { id: 'daily',    name: 'Gündelik İşler',       icon: 'list-checks',    color: '#0ea5e9', builtin: true },
    { id: 'school',   name: 'Okul İşleri',          icon: 'graduation-cap', color: '#f59e0b', builtin: true },
    { id: BILLS_ID,   name: 'Taksitler & Ödemeler', icon: 'wallet',         color: '#10b981', builtin: true },
    { id: 'monthly',  name: 'Aylık Rutinler',       icon: 'calendar-clock', color: '#ec4899', builtin: true },
  ];
  const MONTHLY_ID = 'monthly';
  // Aylık Rutinler > bölümler (parent: 'monthly'), Faturalar > türler (parent: 'fatura')
  const SUBS = [
    { id: 'genel',       name: 'Genel',        icon: 'list-checks', parent: 'monthly' },
    { id: 'aidat',       name: 'Aidatlar',     icon: 'building-2',  parent: 'monthly' },
    { id: 'fatura',      name: 'Faturalar',    icon: 'receipt',     parent: 'monthly' },
    { id: 'bt_elektrik', name: 'Elektrik',     icon: 'zap',         parent: 'fatura' },
    { id: 'bt_su',       name: 'Su',           icon: 'droplets',    parent: 'fatura' },
    { id: 'bt_gaz',      name: 'Doğalgaz',     icon: 'flame',       parent: 'fatura' },
    { id: 'bt_internet', name: 'İnternet',     icon: 'wifi',        parent: 'fatura' },
    { id: 'bt_mobil',    name: 'Mobil Hatlar', icon: 'smartphone',  parent: 'fatura' },
  ];
  const SUB_ICONS = ['zap','droplets','flame','wifi','smartphone','building-2','receipt','home','car','shield','tv','credit-card','shopping-cart','graduation-cap','heart','briefcase','fuel','trash-2'];
  const ICON_CHOICES = ['folder','heart','car','shopping-cart','plane','briefcase','home','gift','dumbbell','book-open','music','star','pill','pawn','coffee','camera','phone','gamepad-2'].map(i => i === 'pawn' ? 'paw-print' : i);
  const COLOR_CHOICES = ['#6366f1','#0ea5e9','#10b981','#f59e0b','#ef4444','#ec4899','#8b5cf6','#14b8a6','#f97316','#64748b'];
  const PRIORITY = {
    high:   { label: 'Yüksek', rank: 0, cls: 'text-rose-600 bg-rose-500/10 dark:text-rose-400' },
    medium: { label: 'Orta',   rank: 1, cls: 'text-amber-600 bg-amber-500/10 dark:text-amber-400' },
    low:    { label: 'Düşük',  rank: 2, cls: 'text-sky-600 bg-sky-500/10 dark:text-sky-400' },
  };

  /* ---------- Yardımcılar ---------- */
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const money = n => Number(n || 0).toLocaleString('tr-TR', { style: 'currency', currency: 'TRY', minimumFractionDigits: 2 });
  const pad = n => String(n).padStart(2, '0');
  const toISO = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const todayDate = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
  const parseISO = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
  const daysUntil = s => Math.round((parseISO(s) - todayDate()) / 86400000);
  const fmtDate = s => parseISO(s).toLocaleDateString('tr-TR', { day: 'numeric', month: 'short', year: 'numeric' });
  const toMin = hhmm => { const [h, m] = hhmm.split(':').map(Number); return h * 60 + (m || 0); };
  const addDays = n => { const d = todayDate(); d.setDate(d.getDate() + n); return toISO(d); };

  /* ---------- Durum ---------- */
  let state = load();
  const ui = { cat: 'all', sub: 'all', bt: 'all', status: 'all', date: 'all', sort: 'date', q: '' };

  function load() {
    try {
      const raw = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (raw && Array.isArray(raw.tasks) && Array.isArray(raw.customCats)) {
        if (!Array.isArray(raw.customSubs)) raw.customSubs = [];
        if (!Array.isArray(raw.skips)) raw.skips = [];
        return raw;
      }
    } catch (e) {}
    return { tasks: [], customCats: [], customSubs: [], skips: [] };
  }
  const allSubs = parent => [...SUBS, ...state.customSubs].filter(s => s.parent === parent);
  const getSub = id => [...SUBS, ...state.customSubs].find(s => s.id === id);
  const isCustomSub = id => state.customSubs.some(s => s.id === id);
  // Hangi görevlerde tutar alanı açılır?
  const needsAmount = (cat, sub) => cat === BILLS_ID || (cat === MONTHLY_ID && !!sub && sub !== 'genel');
  // Bir sonraki ayın belirlenen gününü verir (ayın son gününü aşarsa ayın son gününe çeker)
  function occurrence(iso, day) {
    const d = parseISO(iso);
    const y = d.getFullYear() + (d.getMonth() === 11 ? 1 : 0), m = (d.getMonth() + 1) % 12;
    const last = new Date(y, m + 1, 0).getDate();
    return toISO(new Date(y, m, Math.min(day || d.getDate(), last)));
  }
  const DAYS = ['Pazar', 'Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi'];
  function addDaysTo(iso, n) { const d = parseISO(iso); d.setDate(d.getDate() + n); return toISO(d); }
  // from tarihinde veya sonrasında gelen ilk 'wd' (0=Pazar … 6=Cumartesi) günü
  function nextWeekday(wd, from) { const d = parseISO(from); return addDaysTo(from, (wd - d.getDay() + 7) % 7); }
  // Tekrar eden kayıtlar: haftalık → tarihine 3 gün kala, aylık → 10 gün kala sonraki kayıt otomatik açılır
  const LOOKAHEAD = { weekly: 3, monthly: 10 }, FLOOR = { weekly: -7, monthly: -45 };
  function ensureRecurring() {
    let changed = false;
    state.tasks.forEach(t => {
      if (t.spawned) { t.recurring = false; delete t.spawned; changed = true; }
      if (t.recurring && !t.seriesId) { t.seriesId = t.id; changed = true; }
      if (t.recurring && !t.freq) { t.freq = 'monthly'; changed = true; }
    });
    const groups = {};
    state.tasks.forEach(t => { if (t.seriesId) (groups[t.seriesId] = groups[t.seriesId] || []).push(t); });
    for (const sid in groups) {
      const latest = groups[sid].reduce((a, b) => ((a.date || '') >= (b.date || '') ? a : b));
      if (!latest.recurring || !latest.date) continue;
      const freq = latest.freq === 'weekly' ? 'weekly' : 'monthly';
      const limit = addDays(LOOKAHEAD[freq]), floor = addDays(FLOOR[freq]);
      const day = latest.rday || parseISO(latest.date).getDate();
      let cur = latest.date, guard = 0;
      while (guard++ < 200) {
        const nd = freq === 'weekly' ? addDaysTo(cur, 7) : occurrence(cur, day);
        if (nd > limit) break;
        cur = nd;
        if (nd < floor || state.skips.includes(sid + '|' + nd)) continue;
        state.tasks.push({ ...latest, id: uid(), date: nd, done: false, createdAt: Date.now(), seriesId: sid, rday: day, freq, recurring: true });
        changed = true;
      }
    }
    return changed;
  }
  function save() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch (e) { toast('Veriler kaydedilemedi (depolama dolu olabilir)', 'error'); }
    queueSync();
  }
  const allCats = () => [...DEFAULT_CATS, ...state.customCats];
  const getCat = id => allCats().find(c => c.id === id) || DEFAULT_CATS[1];

  /* ---------- Tema ---------- */
  function applyTheme(t) {
    document.documentElement.classList.toggle('dark', t === 'dark');
  }
  (function initTheme() {
    const saved = localStorage.getItem(THEME_KEY);
    applyTheme(saved || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  })();
  $('#themeBtn').onclick = () => {
    const next = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
    applyTheme(next);
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
  };

  /* ---------- Durum rozeti ---------- */
  function dueInfo(t) {
    if (t.done) return { label: 'Tamamlandı', icon: 'check-circle-2', cls: 'text-emerald-600 bg-emerald-500/10 dark:text-emerald-400', key: 'done' };
    if (!t.date) return null;
    const d = daysUntil(t.date);
    if (d < 0)  return { label: `Gecikti · ${-d} gün`, icon: 'alert-triangle', cls: 'text-rose-600 bg-rose-500/10 dark:text-rose-400', key: 'overdue' };
    if (d === 0) {
      const n = new Date(), late = t.time && (n.getHours() * 60 + n.getMinutes()) >= toMin(t.time);
      return { label: t.time ? (late ? `Zamanı Geldi · ${t.time}` : `Bugün ${t.time}`) : 'Bugün Son Gün', icon: 'flame', cls: 'text-orange-600 bg-orange-500/10 dark:text-orange-400', key: 'today' };
    }
    if (d <= 3) return { label: d === 1 ? 'Yarın · Yaklaşıyor' : `${d} gün kaldı · Yaklaşıyor`, icon: 'clock', cls: 'text-amber-600 bg-amber-500/10 dark:text-amber-400', key: 'soon' };
    return { label: `${d} gün kaldı`, icon: 'calendar', cls: 'text-zinc-600 bg-zinc-500/10 dark:text-zinc-400', key: 'later' };
  }

  /* ---------- Filtreleme ---------- */
  function filtered() {
    const q = ui.q.trim().toLocaleLowerCase('tr');
    const now = todayDate();
    const ym = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
    let list = state.tasks.filter(t => {
      if (ui.cat !== 'all' && t.category !== ui.cat) return false;
      if (ui.cat === MONTHLY_ID && ui.sub !== 'all') {
        if ((t.sub || 'genel') !== ui.sub) return false;
        if (ui.sub === 'fatura' && ui.bt !== 'all' && (t.bt || '') !== ui.bt) return false;
      }
      if (ui.status === 'active' && t.done) return false;
      if (ui.status === 'done' && !t.done) return false;
      if (q && !(`${t.title} ${t.desc || ''} ${getCat(t.category).name}`.toLocaleLowerCase('tr').includes(q))) return false;
      switch (ui.date) {
        case 'today':   if (!t.date || daysUntil(t.date) !== 0) return false; break;
        case 'week':    if (!t.date || daysUntil(t.date) < 0 || daysUntil(t.date) > 7) return false; break;
        case 'month':   if (!t.date || !t.date.startsWith(ym)) return false; break;
        case 'overdue': if (!t.date || t.done || daysUntil(t.date) >= 0) return false; break;
        case 'nodate':  if (t.date) return false; break;
      }
      return true;
    });
    const byDate = (a, b) => (a.date || '9999-99-99').localeCompare(b.date || '9999-99-99');
    list.sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      switch (ui.sort) {
        case 'priority': return PRIORITY[a.priority].rank - PRIORITY[b.priority].rank || byDate(a, b);
        case 'newest':   return (b.createdAt || 0) - (a.createdAt || 0);
        case 'title':    return a.title.localeCompare(b.title, 'tr');
        default:         return byDate(a, b) || PRIORITY[a.priority].rank - PRIORITY[b.priority].rank;
      }
    });
    return list;
  }

  /* ---------- Render ---------- */
  function render() {
    if (ensureRecurring()) save();
    renderStats();
    renderTabs();
    renderSubTabs();
    renderSeg();
    renderList();
    updateTitleBadge();
    lucide.createIcons();
  }

  function renderStats() {
    const now = todayDate();
    const ym = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
    const active = state.tasks.filter(t => !t.done).length;
    const done = state.tasks.filter(t => t.done).length;
    const monthBills = state.tasks.filter(t => +t.amount > 0 && t.date && t.date.startsWith(ym));
    const due = monthBills.filter(t => !t.done).reduce((s, t) => s + (+t.amount || 0), 0);
    const paid = monthBills.filter(t => t.done).reduce((s, t) => s + (+t.amount || 0), 0);
    const overdue = state.tasks.filter(t => !t.done && t.date && daysUntil(t.date) < 0).length;
    const total = state.tasks.length;
    const pct = total ? Math.round(done / total * 100) : 0;

    const card = (icon, color, label, value, sub) => `
      <div class="rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200/70 dark:border-zinc-800 card-shadow p-4 sm:p-5">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-medium text-zinc-500 dark:text-zinc-400">${label}</span>
          <span class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:${color}1f;color:${color}"><i data-lucide="${icon}" class="w-4 h-4"></i></span>
        </div>
        <div class="text-2xl sm:text-[26px] font-semibold tracking-tight">${value}</div>
        <div class="mt-1 text-xs text-zinc-500 dark:text-zinc-400 truncate">${sub}</div>
      </div>`;
    $('#stats').innerHTML =
      card('circle-dot', '#6366f1', 'Aktif Görev', active, `Toplam ${total} görev`) +
      card('check-circle-2', '#10b981', 'Tamamlanan', done, `%${pct} tamamlanma`) +
      card('banknote', '#0ea5e9', 'Bu Ay Ödenecek', money(due), paid ? `Ödenen: ${money(paid)}` : 'Fatura, aidat & taksit') +
      card('alert-triangle', '#ef4444', 'Geciken', overdue, overdue ? 'Acil ilgilenin' : 'Hepsi yolunda');
  }

  function renderTabs() {
    const countFor = id => state.tasks.filter(t => !t.done && (id === 'all' || t.category === id)).length;
    const tab = (id, name, icon, color) => {
      const on = ui.cat === id;
      return `<button data-cat="${esc(id)}" class="shrink-0 flex items-center gap-2 pl-3 pr-3 h-9 rounded-full text-sm font-medium border transition
        ${on ? 'bg-zinc-900 text-white border-zinc-900 dark:bg-white dark:text-zinc-900 dark:border-white shadow-md'
             : 'bg-white dark:bg-zinc-900 border-zinc-200 dark:border-zinc-800 text-zinc-600 dark:text-zinc-300 hover:border-zinc-300 dark:hover:border-zinc-700'}">
        <i data-lucide="${icon}" class="w-4 h-4" ${on ? '' : `style="color:${color}"`}></i>${esc(name)}
        <span class="text-[11px] px-1.5 py-0.5 rounded-full ${on ? 'bg-white/20 dark:bg-zinc-900/10' : 'bg-zinc-100 dark:bg-zinc-800 text-zinc-500'}">${countFor(id)}</span>
      </button>`;
    };
    $('#tabs').innerHTML = tab('all', 'Tümü', 'layout-grid', '#6366f1') + allCats().map(c => tab(c.id, c.name, c.icon, c.color)).join('');
  }

  function renderSubTabs() {
    const box = $('#subTabs');
    if (ui.cat !== MONTHLY_ID) { box.innerHTML = ''; return; }
    const open = state.tasks.filter(t => t.category === MONTHLY_ID && !t.done);
    const chip = (attr, id, name, icon, on, count, custom) => `
      <button ${attr}="${esc(id)}" ${custom ? `data-custom="${esc(id)}" title="Silmek için sağ tık / uzun bas"` : ''} class="shrink-0 flex items-center gap-1.5 px-3 h-8 rounded-lg text-[13px] font-medium transition
        ${on ? 'bg-indigo-600 text-white shadow' : 'bg-zinc-200/60 dark:bg-zinc-900 text-zinc-600 dark:text-zinc-300 hover:bg-zinc-200 dark:hover:bg-zinc-800'}">
        <i data-lucide="${icon}" class="w-3.5 h-3.5"></i>${esc(name)}<span class="opacity-70 text-[11px]">${count}</span></button>`;
    const addBtn = (parent, label) => `
      <button data-addsub="${parent}" class="shrink-0 flex items-center gap-1 px-3 h-8 rounded-lg text-[13px] border border-dashed border-zinc-300 dark:border-zinc-700 text-zinc-500 hover:border-indigo-500 hover:text-indigo-500 transition">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>${label}</button>`;
    let html = `<div class="flex gap-2 overflow-x-auto no-scrollbar">` +
      chip('data-sub', 'all', 'Tümü', 'layout-grid', ui.sub === 'all', open.length) +
      allSubs('monthly').map(s => chip('data-sub', s.id, s.name, s.icon, ui.sub === s.id, open.filter(t => (t.sub || 'genel') === s.id).length, isCustomSub(s.id))).join('') +
      addBtn('monthly', 'Bölüm') + `</div>`;
    if (ui.sub === 'fatura') {
      const inv = open.filter(t => t.sub === 'fatura');
      html += `<div class="flex gap-2 overflow-x-auto no-scrollbar pl-3 border-l-2 border-indigo-500/40 ml-1">` +
        chip('data-bt', 'all', 'Tüm faturalar', 'receipt', ui.bt === 'all', inv.length) +
        allSubs('fatura').map(s => chip('data-bt', s.id, s.name, s.icon, ui.bt === s.id, inv.filter(t => t.bt === s.id).length, isCustomSub(s.id))).join('') +
        addBtn('fatura', 'Gider türü') + `</div>`;
    }
    box.innerHTML = html;
  }

  function subChips(t) {
    const rec = t.recurring && t.date ? `<span class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-[11px] font-medium bg-indigo-500/10 text-indigo-600 dark:text-indigo-400"><i data-lucide="repeat" class="w-3 h-3"></i>${t.freq === 'weekly' ? 'Her ' + DAYS[parseISO(t.date).getDay()] : 'Her ay ' + parseISO(t.date).getDate() + '.'}</span>` : '';
    if (t.category !== MONTHLY_ID) return rec;
    const chipOf = s => `<span class="inline-flex items-center gap-1 px-2 py-1 rounded-md text-[11px] font-medium bg-zinc-500/10 text-zinc-600 dark:text-zinc-300"><i data-lucide="${s.icon}" class="w-3 h-3"></i>${esc(s.name)}</span>`;
    const s = getSub(t.sub || 'genel'), b = t.bt ? getSub(t.bt) : null;
    return (s && s.id !== 'genel' ? chipOf(s) : '') + (b ? chipOf(b) : '') + rec;
  }

  function summaryHTML(list) {
    const withAmt = list.filter(t => +t.amount > 0);
    if (!withAmt.length) return '';
    const sum = arr => arr.reduce((s, t) => s + (+t.amount || 0), 0);
    const pending = sum(withAmt.filter(t => !t.done)), paid = sum(withAmt.filter(t => t.done));
    return `<div class="lg:col-span-2 rounded-2xl bg-indigo-500/5 border border-indigo-500/20 px-4 py-3 text-sm flex flex-wrap items-center gap-x-6 gap-y-1">
      <span class="flex items-center gap-2 font-medium"><i data-lucide="calculator" class="w-4 h-4 text-indigo-500"></i>Listelenen tutarlar</span>
      <span class="text-zinc-500 dark:text-zinc-400">Bekleyen: <b class="text-amber-600 dark:text-amber-400">${money(pending)}</b></span>
      <span class="text-zinc-500 dark:text-zinc-400">Ödenen: <b class="text-emerald-600 dark:text-emerald-400">${money(paid)}</b></span>
      <span class="text-zinc-500 dark:text-zinc-400">Toplam: <b class="text-zinc-900 dark:text-zinc-100">${money(pending + paid)}</b></span></div>`;
  }

  function renderSeg() {
    const items = [['all', 'Tümü'], ['active', 'Aktif'], ['done', 'Tamamlanan']];
    $('#statusSeg').innerHTML = items.map(([k, l]) => `
      <button data-status="${k}" class="px-3.5 h-8 rounded-lg text-sm font-medium transition ${ui.status === k
        ? 'bg-white dark:bg-zinc-700 shadow-sm text-zinc-900 dark:text-white' : 'text-zinc-500 dark:text-zinc-400 hover:text-zinc-800 dark:hover:text-zinc-200'}">${l}</button>`).join('');
  }

  function renderList() {
    const list = filtered();
    const el = $('#list');
    if (!list.length) {
      el.innerHTML = `
        <div class="lg:col-span-2 rounded-3xl border border-dashed border-zinc-300 dark:border-zinc-800 py-16 px-6 text-center">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-zinc-100 dark:bg-zinc-900 flex items-center justify-center mb-4"><i data-lucide="inbox" class="w-7 h-7 text-zinc-400"></i></div>
          <h3 class="font-semibold">${state.tasks.length ? 'Sonuç bulunamadı' : 'Henüz görev yok'}</h3>
          <p class="text-sm text-zinc-500 dark:text-zinc-400 mt-1">${state.tasks.length ? 'Filtreleri veya aramayı değiştirmeyi deneyin.' : 'İlk görevinizi ekleyin ya da örnek verilerle başlayın.'}</p>
          ${state.tasks.length ? '' : `<div class="mt-5 flex justify-center gap-2">
            <button data-act="add" class="px-4 h-9 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium">Görev Ekle</button>
            <button data-act="demo" class="px-4 h-9 rounded-xl bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 text-sm font-medium">Örnek Veri</button></div>`}
        </div>`;
      return;
    }
    el.innerHTML = summaryHTML(list) + list.map(t => {
      const cat = getCat(t.category), pr = PRIORITY[t.priority] || PRIORITY.medium, di = dueInfo(t);
      const accent = !t.done && di && di.key === 'overdue' ? 'ring-1 ring-rose-500/40' : '';
      return `
      <article data-id="${t.id}" class="group rounded-2xl bg-white dark:bg-zinc-900 border border-zinc-200/70 dark:border-zinc-800 card-shadow p-4 flex gap-3.5 transition hover:-translate-y-0.5 ${accent} ${t.done ? 'opacity-55' : ''}">
        <button data-toggle class="mt-0.5 shrink-0 w-6 h-6 rounded-full border-2 flex items-center justify-center transition
          ${t.done ? 'bg-emerald-500 border-emerald-500 text-white' : 'border-zinc-300 dark:border-zinc-600 hover:border-indigo-500'}" aria-label="Tamamla">
          ${t.done ? '<i data-lucide="check" class="w-3.5 h-3.5"></i>' : ''}
        </button>
        <div class="min-w-0 flex-1">
          <div class="flex items-start justify-between gap-2">
            <h3 class="font-medium text-[15px] leading-snug break-words ${t.done ? 'line-through' : ''}">${esc(t.title)}</h3>
            ${+t.amount > 0 ? `<span class="shrink-0 text-sm font-semibold ${t.done ? 'line-through' : 'text-emerald-600 dark:text-emerald-400'}">${money(t.amount)}</span>` : ''}
          </div>

            ${subChips(t)}
            <span class="px-2 py-1 rounded-md text-[11px] font-medium ${pr.cls}">${pr.label}</span>

            ${t.date ? `<span class="inline-flex items-center gap-1 text-[11px] text-zinc-500 dark:text-zinc-400 ml-0.5"><i data-lucide="calendar" class="w-3 h-3"></i>${fmtDate(t.date)}${t.time ? ' · ' + t.time : ''}</span>` : ''}

  /* ---------- Toast ---------- */
  let toastTimer;
  function toast(msg, type = 'ok') {
    const icon = type === 'error' ? 'alert-circle' : 'check-circle-2';
    const color = type === 'error' ? 'text-rose-400' : 'text-emerald-400';
    $('#toast').innerHTML = `<div class="pop flex items-center gap-2 px-4 py-2.5 rounded-xl bg-zinc-900 dark:bg-white text-white dark:text-zinc-900 text-sm shadow-xl">
      <i data-lucide="${icon}" class="w-4 h-4 ${color}"></i>${esc(msg)}</div>`;
    lucide.createIcons();
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('#toast').innerHTML = '', 2400);
  }

  /* ---------- Görev Modalı ---------- */
  const taskModal = $('#taskModal');
  function fillCategorySelect(sel) {
    $('#fCategory').innerHTML = allCats().map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('');
    if (sel) $('#fCategory').value = sel;
  }
  function fillSubSelects(sub, bt) {
    $('#fSub').innerHTML = allSubs('monthly').map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
    $('#fSub').value = sub || 'genel';
    $('#fBt').innerHTML = '<option value="">Belirtilmemiş</option>' + allSubs('fatura').map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');
    $('#fBt').value = bt || '';
  }
  function updateForm() {
    const cat = $('#fCategory').value, monthly = cat === MONTHLY_ID, sub = $('#fSub').value;
    $('#subWrap').classList.toggle('hidden', !monthly);
    $('#btWrap').classList.toggle('hidden', !(monthly && sub === 'fatura'));
    const rep = $('#fRepeat').value, hint = $('#recurHint');
    $('#wdayWrap').classList.toggle('hidden', rep !== 'weekly');
    hint.classList.toggle('hidden', !rep);
    hint.textContent = rep === 'weekly' ? `Her ${DAYS[+$('#fWday').value]} günü otomatik yeni kayıt açılır (3 gün önceden görünür).`
      : rep === 'monthly' ? 'Seçtiğiniz tarihin gününde her ay otomatik yeni kayıt açılır (10 gün önceden görünür).' : '';
    const money = needsAmount(cat, monthly ? sub : '');
    $('#amountWrap').classList.toggle('hidden', !money);
    $('#fDateLabel').textContent = money ? 'Son Ödeme Tarihi' : 'Son Tarih / Hatırlatıcı';
  }
  const defaultRepeat = cat => cat === MONTHLY_ID ? 'monthly' : cat === 'routine' ? 'weekly' : '';
  $('#fCategory').addEventListener('change', () => {
    if (!$('#fId').value) $('#fRepeat').value = defaultRepeat($('#fCategory').value);
    updateForm();
  });
  $('#fRepeat').addEventListener('change', updateForm);
  $('#fWday').addEventListener('change', updateForm);
  $('#fDate').addEventListener('change', () => { if ($('#fDate').value) { $('#fWday').value = parseISO($('#fDate').value).getDay(); updateForm(); } });
  $('#fSub').addEventListener('change', updateForm);

  function openTaskModal(task) {
    $('#modalTitle').textContent = task ? 'Görevi Düzenle' : 'Yeni Görev';
    $('#fId').value = task ? task.id : '';
    $('#fTitle').value = task ? task.title : '';
    fillCategorySelect(task ? task.category : (ui.cat !== 'all' ? ui.cat : 'daily'));
    fillSubSelects(task ? task.sub : (ui.sub !== 'all' ? ui.sub : 'genel'), task ? task.bt : (ui.bt !== 'all' ? ui.bt : ''));
    $('#fRepeat').value = task ? (task.recurring ? (task.freq || 'monthly') : '') : defaultRepeat(ui.cat !== 'all' ? ui.cat : 'daily');
    $('#fWday').value = task && task.date ? parseISO(task.date).getDay() : todayDate().getDay();
    updateForm();
    $('#fPriority').value = task ? task.priority : 'medium';
    $('#fDate').value = task ? (task.date || '') : '';
    $('#fTime').value = task ? (task.time || '') : '';
    $('#fAmount').value = task && task.amount ? task.amount : '';
    $('#fDesc').value = task ? (task.desc || '') : '';
    taskModal.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
    setTimeout(() => $('#fTitle').focus(), 50);
  }
  function closeModals() {
    $$('#taskModal, #catModal, #subModal').forEach(m => m.classList.add('hidden'));
    document.body.style.overflow = '';
  }
  $('#taskForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = $('#fTitle').value.trim();
    if (!title) return;
    const id = $('#fId').value;
    const category = $('#fCategory').value;
    const sub = category === MONTHLY_ID ? $('#fSub').value : '';
    const bt = sub === 'fatura' ? $('#fBt').value : '';
    const repeat = $('#fRepeat').value;
    let date = $('#fDate').value || '';
    if (repeat === 'weekly') date = nextWeekday(+$('#fWday').value, date || toISO(todayDate()));
    const data = {
      title, category, sub, bt,
      priority: $('#fPriority').value,
      date,
      time: date ? ($('#fTime').value || '') : '',
      desc: $('#fDesc').value.trim(),
      amount: needsAmount(category, sub) ? (parseFloat($('#fAmount').value) || 0) : 0,
      recurring: !!repeat,
      freq: repeat,
    };
    if (repeat === 'monthly' && !date) { toast('Aylık tekrar için bir tarih seçin', 'error'); return; }
    data.rday = repeat === 'monthly' ? parseISO(date).getDate() : 0;
    if (id) {
      const t = state.tasks.find(x => x.id === id);
      if (t) { Object.assign(t, data); if (data.recurring && !t.seriesId) t.seriesId = t.id; }
      toast('Görev güncellendi');
    } else {
      const nid = uid();
      state.tasks.push({ id: nid, done: false, createdAt: Date.now(), ...(data.recurring ? { seriesId: nid } : {}), ...data });
      toast('Görev eklendi');
    }
    save(); closeModals(); render();
  });

  function deleteSub(s) {
    if (!confirm(`"${s.name}" silinsin mi? İçindeki kayıtlar ${s.parent === 'fatura' ? '"Belirtilmemiş" faturalara' : '"Genel" bölümüne'} taşınır.`)) return;
    state.tasks.forEach(t => {
      if (s.parent === 'fatura' && t.bt === s.id) t.bt = '';
      if (s.parent === 'monthly' && t.sub === s.id) { t.sub = 'genel'; t.bt = ''; }
    });
    state.customSubs = state.customSubs.filter(x => x.id !== s.id);
    if (ui.sub === s.id) { ui.sub = 'all'; ui.bt = 'all'; }

  /* ---------- Yedekleme (cihaza dosya olarak) ---------- */
  function exportData() {
    const json = JSON.stringify({ app: 'gorev-asistani', version: 1, exportedAt: new Date().toISOString(), data: state }, null, 2);
    if (native) {
      let r = 'err';
      try { r = AndroidBridge.saveBackup(`gorev-yedek-${toISO(new Date())}.json`, json); } catch (e) {}
      toast(r === 'ok' ? 'Yedek "İndirilenler" klasörüne kaydedildi' : 'Yedek kaydedilemedi', r === 'ok' ? 'ok' : 'error');
      return;
    }
    const blob = new Blob([json], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `gorev-yedek-${toISO(new Date())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    toast('Yedek dosyası indirildi');
  }
  $('#importFile').addEventListener('change', e => {
    const file = e.target.files[0]; e.target.value = '';
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result), d = j.data || j;
        if (!d || !Array.isArray(d.tasks)) throw new Error('bad');
        if (!confirm(`Yedekte ${d.tasks.length} görev var. Mevcut veriler bununla değiştirilsin mi?`)) return;
        state = { tasks: d.tasks, customCats: Array.isArray(d.customCats) ? d.customCats : [], customSubs: Array.isArray(d.customSubs) ? d.customSubs : [], skips: Array.isArray(d.skips) ? d.skips : [] };
        Object.assign(ui, { cat: 'all', sub: 'all', bt: 'all' });
        save(); render(); toast('Yedek geri yüklendi');
      } catch (err) { toast('Geçersiz yedek dosyası', 'error'); }
    };
    r.readAsText(file);
  });
  // Tarayıcıdan verilerin otomatik silinmemesini iste (sessizce)
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
  $('#list').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) { act.dataset.act === 'add' ? openTaskModal() : doDemo(); return; }
    const card = e.target.closest('article[data-id]'); if (!card) return;
    const t = state.tasks.find(x => x.id === card.dataset.id); if (!t) return;
    if (e.target.closest('[data-toggle]')) {
      t.done = !t.done; save(); render();
      toast(t.done ? 'Tamamlandı olarak işaretlendi' : 'Tekrar aktif');
    } else if (e.target.closest('[data-edit]')) {
      openTaskModal(t);
    } else if (e.target.closest('[data-del]')) {
      if (confirm(`"${t.title}" silinsin mi?`)) {
        if (t.seriesId) {
          if (t.recurring && confirm(`Bu kayıt ${t.freq === 'weekly' ? 'her hafta' : 'her ay'} tekrarlanıyor.\n\nTamam: Tekrarı da bitir (sonraki kayıtlar oluşmasın)\nİptal: Sadece bu kaydı sil`)) {
            state.tasks.forEach(x => { if (x.seriesId === t.seriesId) x.recurring = false; });
          } else if (t.date) state.skips.push(t.seriesId + '|' + t.date);
        }
        state.tasks = state.tasks.filter(x => x.id !== t.id); save(); render(); toast('Görev silindi');
      }
    }
  });

  function deleteCategory(c) {
    if (!confirm(`"${c.name}" kategorisi silinsin mi? İçindeki görevler "Gündelik İşler" kategorisine taşınır.`)) return;
    state.tasks.forEach(t => { if (t.category === c.id) t.category = 'daily'; });
    state.customCats = state.customCats.filter(x => x.id !== c.id);
    if (ui.cat === c.id) ui.cat = 'all';
    save(); render(); toast('Kategori silindi');
  }

  $('#statusSeg').addEventListener('click', e => {
    const b = e.target.closest('[data-status]'); if (!b) return;
    ui.status = b.dataset.status; render();
  });
  $('#dateFilter').onchange = e => { ui.date = e.target.value; render(); };
  $('#sortBy').onchange = e => { ui.sort = e.target.value; render(); };
  const onSearch = e => {
    ui.q = e.target.value;
    $('#searchDesktop').value = $('#searchMobile').value = ui.q;
    renderList(); lucide.createIcons();
  };
  $('#searchDesktop').oninput = onSearch;
  $('#searchMobile').oninput = onSearch;

  document.addEventListener('click', e => { if (e.target.closest('[data-close]')) closeModals(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModals(); });

  /* ---------- Bildirimler & Hatırlatıcılar ---------- */
  const NKEY = 'gorev-asistani-notif';
  const native = !!window.AndroidBridge;   // Android uygulaması içinde mi çalışıyoruz?
  const notifSupported = native || 'Notification' in window;
  const nset = (() => {
    let s = {};
    try { s = JSON.parse(localStorage.getItem(NKEY)) || {}; } catch (e) {}
    return Object.assign({ enabled: native, hour: 9, lead: 3, sent: {} }, s);
  })();
  const nsave = () => { try { localStorage.setItem(NKEY, JSON.stringify(nset)); } catch (e) {} };
  const notifOn = () => native || (notifSupported && nset.enabled && Notification.permission === 'granted');

  function updateTitleBadge() {
    const n = state.tasks.filter(t => !t.done && t.date && daysUntil(t.date) <= 0).length;
    document.title = (n ? `(${n}) ` : '') + 'Görev, Rutin ve Finans Asistanı';
  }

  function showNotif(title, body, tag) {
    if (native) { try { AndroidBridge.testNotification(); } catch (e) {} return; }
    try {
      const n = new Notification(title, { body, tag, renotify: false });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) {
      // Mobil tarayıcılar için Service Worker üzerinden dene
      if (navigator.serviceWorker) navigator.serviceWorker.getRegistration().then(r => r && r.showNotification(title, { body, tag })).catch(() => {});
    }
  }

  function itemLine({ t, type, d }) {
    const amt = +t.amount > 0 ? ` · ${money(t.amount)}` : '';
    if (type === 'overdue') return `⚠️ Gecikti (${-d} gün): ${t.title}${amt}`;
    if (type === 'due')     return `🔔 Zamanı geldi (${t.time}): ${t.title}${amt}`;
    if (type === 'today')   return `🔔 Bugün son gün: ${t.title}${amt}`;
    return `⏳ ${d} gün kaldı: ${t.title}${amt}`;
  }

  function checkReminders() {
    if (ensureRecurring()) { save(); render(); }
    updateTitleBadge();
    if (native || !notifOn()) return;   // Android'de bildirimleri telefonun alarm sistemi gönderir
    const now = new Date(), todayISO = toISO(now), nowMin = now.getHours() * 60 + now.getMinutes();
    const hourReached = nowMin >= nset.hour * 60;
    // Eski kayıtları temizle
    const cutoff = addDays(-7);
    Object.keys(nset.sent).forEach(k => { if (nset.sent[k] < cutoff) delete nset.sent[k]; });

    const out = [];
    for (const t of state.tasks) {
      if (t.done || !t.date) continue;
      const d = daysUntil(t.date);
      let type = null;
      if (d < 0) { if (hourReached) type = 'overdue'; }
      else if (d === 0) {
        if (t.time) { if (nowMin >= toMin(t.time)) type = 'due'; }
        else if (hourReached) type = 'today';
      } else if (d <= nset.lead && hourReached) type = 'soon';
      if (!type) continue;
      const key = `${t.id}|${type}|${todayISO}`;
      if (nset.sent[key]) continue;
      nset.sent[key] = todayISO;
      out.push({ t, type, d });
    }
    if (!out.length) return;
    nsave();
    const rank = { due: 0, overdue: 1, today: 2, soon: 3 };
    out.sort((a, b) => rank[a.type] - rank[b.type]);
    if (out.length <= 3) {
      out.forEach(o => showNotif(o.type === 'overdue' ? 'Geciken görev' : o.type === 'soon' ? 'Yaklaşan görev' : 'Görev zamanı', itemLine(o), o.t.id + o.type));
    } else {
      const extra = out.length - 5;
      showNotif(`${out.length} hatırlatma`, out.slice(0, 5).map(itemLine).join('\n') + (extra > 0 ? `\n… ve ${extra} tane daha` : ''), 'summary-' + todayISO);
    }
  }

  function renderNotifPanel() {
    if (native) {
      let st = { notif: true, exact: true };
      try { st = JSON.parse(AndroidBridge.permissionStatus()); } catch (e) {}
      const ok = st.notif && st.exact;
      let info = { count: 0, next: 0 }, batt = true;
      try { info = JSON.parse(AndroidBridge.scheduledInfo()); } catch (e) {}
      try { batt = AndroidBridge.batteryUnrestricted(); } catch (e) {}
      const nextTxt = info.next ? new Date(info.next).toLocaleString('tr-TR', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—';
      const hoursN = Array.from({ length: 17 }, (_, i) => i + 6).map(h => `<option value="${h}" ${nset.hour === h ? 'selected' : ''}>${pad(h)}:00</option>`).join('');
      const leadsN = [1, 2, 3, 5, 7].map(n => `<option value="${n}" ${nset.lead === n ? 'selected' : ''}>${n} gün önce</option>`).join('');
      const row = (good, okTxt, badTxt) => `<p class="flex items-start gap-2 text-[13px] text-zinc-600 dark:text-zinc-300"><span class="mt-1.5 w-2 h-2 rounded-full shrink-0 ${good ? 'bg-emerald-500' : 'bg-rose-500'}"></span>${good ? okTxt : badTxt}</p>`;
      $('#notifPanel').innerHTML = `
        <div class="flex items-center gap-2"><i data-lucide="bell-ring" class="w-4 h-4 text-indigo-500"></i><h3 class="font-semibold text-sm">Hatırlatmalar</h3></div>
        ${row(st.notif, 'Bildirim izni verildi', 'Bildirim izni gerekli')}
        ${row(st.exact, 'Tam zamanında alarm izni verildi', 'Saatinde bildirim için alarm izni gerekli')}
        ${row(batt, 'Pil kısıtlaması yok', 'Pil kısıtlaması açık: kapalıyken bildirim gelmeyebilir')}
        ${batt ? '' : `<button data-n="battery" class="w-full h-9 rounded-xl text-sm font-medium border border-zinc-200 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">Pil kısıtlamasını kaldır</button>`}
        <p class="text-[13px] text-zinc-600 dark:text-zinc-300">Planlanan hatırlatma: <b>${info.count}</b> · Sıradaki: <b>${nextTxt}</b></p>
        ${ok ? '' : `<button data-n="perm" class="w-full h-9 rounded-xl text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/25 transition">İzinleri iste</button>`}
        ${st.notif ? '' : `<button data-n="notifsettings" class="w-full h-9 rounded-xl text-sm font-medium border border-zinc-200 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">Bildirim ayarlarını aç</button>`}
        <div class="space-y-2.5 pt-1">
          <div><label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1">Günlük hatırlatma saati</label><select id="nHour" class="field">${hoursN}</select></div>
          <div><label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1">Yaklaşanları şu kadar önce bildir</label><select id="nLead" class="field">${leadsN}</select></div>
          <button data-n="test" class="w-full h-9 rounded-xl text-sm font-medium border border-zinc-200 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">Test bildirimi gönder</button>
          <button data-n="test15" class="w-full h-9 rounded-xl text-sm font-medium bg-indigo-600/10 text-indigo-600 dark:text-indigo-400 hover:bg-indigo-600/20 transition">15 sn sonra test (uygulamayı kapatın)</button>
        </div>
        <p class="text-[11.5px] leading-relaxed text-zinc-500 dark:text-zinc-400">Bildirim kapalıyken gelmiyorsa (Oppo, Realme, Xiaomi, Vivo, Huawei): Ayarlar → Uygulamalar → Görev Asistanı → "Otomatik başlatma"yı açın, Pil → "Kısıtlama yok" yapın ve son uygulamalar ekranında uygulama kartını kilitleyin (kilit simgesi). Bu telefonlar uygulamayı kapatınca alarmlarını silebilir.</p>
        <p class="text-[11.5px] leading-relaxed text-zinc-500 dark:text-zinc-400">Hatırlatmalar uygulama kapalıyken de telefonun alarm sistemiyle gelir. Saati girilen görevler tam saatinde, diğerleri günlük hatırlatma saatinde bildirilir. Bildirim gelmezse telefonun pil ayarlarında bu uygulamayı "kısıtlama yok" yapın.</p>`;
      $('#bellDot').classList.toggle('hidden', !ok);
      lucide.createIcons();
      return;
    }
    const perm = notifSupported ? Notification.permission : 'unsupported';
    const on = notifOn();
    const status = !notifSupported ? ['Bu tarayıcı bildirimleri desteklemiyor.', 'bg-zinc-400']
      : perm === 'denied' ? ['İzin engellenmiş. Tarayıcının site ayarlarından bildirimlere izin verin.', 'bg-rose-500']
      : on ? ['Bildirimler açık.', 'bg-emerald-500'] : ['Bildirimler kapalı.', 'bg-zinc-400'];
    const hours = Array.from({ length: 17 }, (_, i) => i + 6).map(h => `<option value="${h}" ${nset.hour === h ? 'selected' : ''}>${pad(h)}:00</option>`).join('');
    const leads = [1, 2, 3, 5, 7].map(n => `<option value="${n}" ${nset.lead === n ? 'selected' : ''}>${n} gün önce</option>`).join('');
    $('#notifPanel').innerHTML = `
      <div class="flex items-center gap-2"><i data-lucide="bell-ring" class="w-4 h-4 text-indigo-500"></i><h3 class="font-semibold text-sm">Bildirimler</h3></div>
      <p class="flex items-start gap-2 text-[13px] text-zinc-600 dark:text-zinc-300"><span class="mt-1.5 w-2 h-2 rounded-full shrink-0 ${status[1]}"></span>${status[0]}</p>
      ${notifSupported && perm !== 'denied' ? (on
        ? `<button data-n="disable" class="w-full h-9 rounded-xl text-sm font-medium bg-zinc-100 dark:bg-zinc-800 hover:bg-zinc-200 dark:hover:bg-zinc-700 transition">Bildirimleri kapat</button>`
        : `<button data-n="enable" class="w-full h-9 rounded-xl text-sm font-medium bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/25 transition">Bildirimleri aç ve izin ver</button>`) : ''}
      ${on ? `
      <div class="space-y-2.5 pt-1">
        <div><label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1">Günlük hatırlatma saati</label><select id="nHour" class="field">${hours}</select></div>
        <div><label class="block text-xs font-medium text-zinc-500 dark:text-zinc-400 mb-1">Yaklaşanları şu kadar önce bildir</label><select id="nLead" class="field">${leads}</select></div>
        <button data-n="test" class="w-full h-9 rounded-xl text-sm font-medium border border-zinc-200 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">Test bildirimi gönder</button>
      </div>` : ''}
      <p class="text-[11.5px] leading-relaxed text-zinc-500 dark:text-zinc-400">Sekme açık kaldığı sürece (arka planda ya da küçültülmüş olsa da) hatırlatmalar gelir. Kapalıyken kaçırılanlar uygulamayı açtığınız anda gösterilir. Saati girilmiş görevler tam o saatte bildirilir.</p>`;
    $('#bellDot').classList.toggle('hidden', !on);
    lucide.createIcons();
  }

  async function enableNotifs() {
    if (native) { try { AndroidBridge.requestPermissions(); } catch (e) {} return; }
    if (!notifSupported) { toast('Bu tarayıcı bildirimleri desteklemiyor', 'error'); return; }
    let p = Notification.permission;
    if (p === 'default') { try { p = await Notification.requestPermission(); } catch (e) { p = 'denied'; } }
    if (p === 'granted') {
      nset.enabled = true; nsave();
      toast('Bildirimler açıldı');
      showNotif('Bildirimler açık', 'Yaklaşan, geciken ve zamanı gelen görevler için haber vereceğim.', 'welcome');
      checkReminders();
    } else toast(p === 'denied' ? 'Bildirim izni engellendi' : 'İzin verilmedi', 'error');
    renderNotifPanel();
  }

  $('#bellBtn').onclick = e => {
    e.stopPropagation();
    const p = $('#notifPanel');
    if (p.classList.contains('hidden')) renderNotifPanel();
    p.classList.toggle('hidden');
    $('#menu').classList.add('hidden');
  };
  document.addEventListener('click', e => { if (!e.target.closest('#notifPanel')) $('#notifPanel').classList.add('hidden'); });
  $('#notifPanel').addEventListener('click', e => {
    const b = e.target.closest('[data-n]'); if (!b) return;
    if (b.dataset.n === 'battery') { try { AndroidBridge.openBatterySettings(); } catch (e) {} }
    else if (b.dataset.n === 'test15') { try { AndroidBridge.scheduleTest(15); toast('15 sn sonra gelecek: uygulamayı şimdi tamamen kapatın'); } catch (e) {} }
    else if (b.dataset.n === 'perm') { try { AndroidBridge.requestPermissions(); } catch (e) {} }
    else if (b.dataset.n === 'notifsettings') { try { AndroidBridge.openNotificationSettings(); } catch (e) {} }
    else if (b.dataset.n === 'enable') enableNotifs();
    else if (b.dataset.n === 'disable') { nset.enabled = false; nsave(); renderNotifPanel(); toast('Bildirimler kapatıldı'); }
    else if (b.dataset.n === 'test') showNotif('Test bildirimi', 'Bildirimler çalışıyor ✅', 'test');
  });
  $('#notifPanel').addEventListener('change', e => {
    if (e.target.id === 'nHour') { nset.hour = +e.target.value; nsave(); checkReminders(); queueSync(); }
    if (e.target.id === 'nLead') { nset.lead = +e.target.value; nsave(); checkReminders(); queueSync(); }
  });

  /* ---- Android: telefonun alarm sistemine hatırlatma listesi gönder ---- */
  function buildReminders() {
    const now = Date.now(), horizon = now + 60 * 864e5, hourMin = nset.hour * 60;
    const tasks = state.tasks.filter(t => !t.done && t.date);
    // Henüz açılmamış tekrar kayıtlarını (haftalık/aylık) ileriye doğru hesapla
    const groups = {};
    state.tasks.forEach(t => { if (t.seriesId) (groups[t.seriesId] = groups[t.seriesId] || []).push(t); });
    for (const sid in groups) {
      const latest = groups[sid].reduce((a, b) => ((a.date || '') >= (b.date || '') ? a : b));
      if (!latest.recurring || !latest.date) continue;
      const weekly = latest.freq === 'weekly', day = latest.rday || parseISO(latest.date).getDate();
      let cur = latest.date, g = 0;
      while (g++ < 120) {
        const nd = weekly ? addDaysTo(cur, 7) : occurrence(cur, day);
        if (parseISO(nd).getTime() > horizon) break;
        cur = nd;
        if (!state.skips.includes(sid + '|' + nd)) tasks.push({ ...latest, id: latest.id + '@' + nd, date: nd, done: false });
      }
    }
    const at = (iso, minutes) => { const d = parseISO(iso); d.setMinutes(minutes); return d.getTime(); };
    const ev = [];
    const add = (ts, title, t) => { if (ts > now && ts <= horizon) ev.push({ at: ts, title, body: t.title + (+t.amount > 0 ? ' · ' + money(t.amount) : '') }); };
    for (const t of tasks) {
      let due = at(t.date, t.time ? toMin(t.time) : hourMin);
      // Bugün son gün ve günlük saat geçmişse: akşam 20:00'de bir kez hatırlat
      if (!t.time && due <= now && t.date === toISO(todayDate()) && now < at(t.date, 20 * 60)) due = at(t.date, 20 * 60);
      add(due, t.time ? `Zamanı geldi (${t.time})` : 'Bugün son gün', t);
      [...new Set([nset.lead, 1])].forEach(n => add(at(addDaysTo(t.date, -n), hourMin), n === 1 ? 'Yarın son gün' : `${n} gün kaldı`, t));
      for (let k = 1; k <= 5; k++) add(at(addDaysTo(t.date, k), hourMin), `Gecikti (${k} gün)`, t);
    }
    ev.sort((a, b) => a.at - b.at);
    return ev.slice(0, 150).map((e, i) => ({ id: 1000 + i, ...e }));
  }
  let syncTimer;
  function queueSync() { if (!native) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNative, 400); }
  function syncNative() { if (!native) return; try { AndroidBridge.syncReminders(JSON.stringify(buildReminders())); } catch (e) {} }
  window.__nativeResume = () => { renderNotifPanel(); syncNative(); };
  window.__nativeBack = () => {
    if ($$('#taskModal, #catModal, #subModal').some(m => !m.classList.contains('hidden'))) { closeModals(); return true; }
    const pn = $('#notifPanel'), mn = $('#menu');
    if (!pn.classList.contains('hidden') || !mn.classList.contains('hidden')) { pn.classList.add('hidden'); mn.classList.add('hidden'); return true; }
    return false;
  };

  // Zamanlayıcı: Web Worker sekme arka plandayken de kısılmadan çalışır
  (function startTicker() {
    const fallback = () => setInterval(checkReminders, 30000);
    try {
      const w = new Worker(URL.createObjectURL(new Blob(['setInterval(function(){postMessage(1)},30000)'], { type: 'application/javascript' })));
      w.onmessage = checkReminders;
      w.onerror = fallback;
    } catch (e) { fallback(); }
    document.addEventListener('visibilitychange', () => { if (!document.hidden) { render(); checkReminders(); } });
    window.addEventListener('focus', checkReminders);
  })();

  /* ---------- Başlangıç ---------- */
  $('#todayLabel').textContent = new Date().toLocaleDateString('tr-TR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  render();
  renderNotifPanel();
  checkReminders();
  syncNative();
  // Gece yarısı geçişinde rozetleri güncel tut
  setInterval(() => { renderStats(); renderList(); lucide.createIcons(); }, 60 * 1000);
})();
</script>
</body>
